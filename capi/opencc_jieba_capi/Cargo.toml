[package]
name = "opencc_jieba_capi"
version = "0.9.0"
edition = "2021"

[package.metadata.capi]
# Fourth component appended to the package version in C API release strings.
revision = 0

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
opencc-jieba-rs = {path = "../..", features = ["keywords"]}
libc = "0.2"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
winres = "0.1"
toml = "=0.8"
