[package]
name = "opencc-jieba"
version = "0.9.0"
edition = "2021"

[dependencies]
opencc-jieba-rs = { path = "../.." }
opencc-tool-common = { path = "../opencc-tool-common" }
clap = "=4.5"
encoding_rs = "=0.8.35"
encoding_rs_io = "0.1"
regex = "1.12"
# Private ZIP module: Stored + DEFLATE, with a Rust 1.75-compatible backend.
crc32fast = "1.5"
flate2 = { version = "=1.1.1", default-features = false, features = ["rust_backend"] }
indexmap = "=2.7.1"
memchr = "2.7"
# Exact dependency pins to preserve MSRV (rustc 1.75.0):
# clap_lex@1.0.1
clap_lex = "=1.0"
#deranged = "=0.4.0"
#time = "=0.3.41"
