[workspace]
members = [
    "capi/opencc_jieba_capi",
    "tools/dict-generate",
    "tools/opencc-clip-jieba",
    "tools/opencc-jieba",
    "tools/opencc-tool-common",
]

[package]
name = "opencc-jieba-rs"
version = "0.9.0"
edition = "2021"
authors = ["Laisuk Lai <laisuk@yahoo.com>"]
description = "High-performance Chinese text conversion and segmentation using Jieba and OpenCC-style dictionaries."
license = "MIT"
repository = "https://github.com/laisuk/opencc-jieba-rs"
homepage = "https://github.com/laisuk/opencc-jieba-rs"
documentation = "https://docs.rs/opencc-jieba-rs"
readme = "README.md"
keywords = ["chinese", "jieba", "opencc", "nlp", "text-processing"]
categories = ["text-processing", "internationalization", "command-line-utilities"]
include = [
    # Rust sources and build script
    "src/**/*.rs",
    "build.rs",
    # Examples and integration tests
    "examples/*.rs",
    "tests/**/*.rs",
    "tests/data/*.txt",
    "tests/dicts/*.txt",
    # OpenCC dictionaries and data
    "src/dictionary_lib/dicts/*.zst",
    "src/data/*.txt",
    # Vendored Jieba
    "src/jieba_rs/hmm.model",
    "src/jieba_rs/data/*.zst",
    # Documentation
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "DETOFU_USER_GUIDE.md",
    "MSRV-1.75.0-GUIDE.md",
    # Licenses and attribution
    "LICENSE",
    "JIEBA-LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "dicts/LICENSE",
    "src/jieba_rs/VENDOR_NOTES.md",
    "src/zstd/NOTICE.md",
    "src/zstd/LICENSE-RUZSTD",
    "src/rustc_hash/LICENSE-MIT",
    "src/rustc_hash/LICENSE-APACHE",
    "src/rustc_hash/VENDOR_NOTES.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytecount = "0.6.9"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = { version = "0.14", optional = true }

# Exact direct dependency pins to preserve behavior and Rust 2021/MSRV compatibility.
# Older toolchains may require a locked dependency graph; see MSRV-1.75.0-GUIDE.md.
rayon = "=1.10"
rayon-core = "=1.12.1"

[features]
default = ["keywords"]
keywords = []
# Enables dictionary-pack generation operations without exposing the runtime
# dictionary representation or its logical slots.
dictionary-build = ["dep:zstd"]

[profile.release]
opt-level = 3              # Maximize speed (better suited for C API performance)
codegen-units = 1          # Optimize across the entire codebase
lto = "fat"                # Full Link Time Optimization
panic = "abort"            # Reduces binary size and prevents unwinding
strip = "symbols"          # Strips debug symbols, retains exportable C symbols
debug = 0                  # No debug info to minimize size
# crt-static = false       # Uncomment to link dynamically to C runtime if needed

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "jieba_baseline"
required-features = ["keywords"]

[[example]]
name = "tfidf_memory_probe"
required-features = ["keywords"]
