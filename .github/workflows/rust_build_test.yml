name: Build and Test

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-docs:
    name: Public docs and package integrity
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs with all features and without default features
        run: |
          cargo doc --locked -p opencc-jieba-rs --no-deps --all-features
          cargo doc --locked -p opencc-jieba-rs --no-deps --no-default-features
      - name: Test without keyword extraction
        run: cargo test --locked -p opencc-jieba-rs --no-default-features
      - name: Verify published sources and packaged tests
        run: |
          cargo package --locked -p opencc-jieba-rs
          for manifest in target/package/opencc-jieba-rs-*/Cargo.toml; do
            cargo test --locked --all-features --manifest-path "$manifest"
          done

  native-capi:
    name: C and C++17 API regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable build -p opencc_jieba_capi --locked
      - name: Compile and run against canonical headers
        env:
          LD_LIBRARY_PATH: target/debug
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I capi/include capi/tests/add_word.c -L target/debug -lopencc_jieba_capi -o target/debug/add_word_c
          c++ -std=c++17 -Wall -Wextra -Werror -I capi/include capi/tests/add_word.cpp -L target/debug -lopencc_jieba_capi -o target/debug/add_word_cpp
          target/debug/add_word_c
          target/debug/add_word_cpp

  msrv:
    name: Rust 1.75 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Test workspace on MSRV (no doctests)
        if: github.event_name == 'push'
        run: cargo test --workspace --all-features --locked --lib --bins --tests --examples

      - name: Test workspace on MSRV (full)
        if: github.event_name != 'push'
        run: cargo test --workspace --all-features --locked
