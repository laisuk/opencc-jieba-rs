name: Build and Test

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.75 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Test workspace on MSRV (no doctests)
        if: github.event_name == 'push'
        run: cargo test --workspace --all-features --locked --lib --bins --tests --examples

      - name: Test workspace on MSRV (full)
        if: github.event_name != 'push'
        run: cargo test --workspace --all-features --locked